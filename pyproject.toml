[project]
name = "tiled-upscaler"
version = "0.1.0"
description = "Educational tiled latent diffusion and ControlNet upscaler"
readme = "README.md"
authors = [
    { name = "alvarolopez6", email = "78911834+alvarolopez6@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.43.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
    "typer>=0.29.1",
]

[project.scripts]
tiled-upscaler = "tiled_upscaler.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
